<!doctype html><html><head><title>Ice giant cloud regression fixture</title></head>
<body style="margin:0;background:black"><script type="module">
import * as THREE from 'three';
import {createGiantPlanetMaterialBundle} from '../../src/rendering/bodies/GiantPlanetMaterials.ts';
import {getGiantAtmosphereProfile} from '../../src/rendering/bodies/GiantPlanetProfiles.ts';
// Sample the production cloud shader without lighting: otherwise a smooth
// featureless sphere can pass a pixel-contrast test from shading alone.
const width=512,height=256,renderer=new THREE.WebGLRenderer({preserveDrawingBuffer:true});
renderer.setSize(width,height);renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-1,1,1,-1,.01,10);
camera.position.z=2;
const fallback=new THREE.DataTexture(new Uint8Array([255,255,255,255]),1,1);fallback.needsUpdate=true;
const geometry=new THREE.PlaneGeometry(2,2),bundles=new Map();
for(const id of ['uranus','neptune']){
 const bundle=createGiantPlanetMaterialBundle(getGiantAtmosphereProfile(id),fallback,null);
 bundle.material.vertexShader=`varying vec2 vUv; varying vec3 vViewPosition;
 varying vec3 vWorldNormal; varying vec3 vVisualNormal;
 void main(){vUv=uv; vViewPosition=vec3(0.,0.,-2.);vWorldNormal=vec3(0.,0.,1.);
 vVisualNormal=vec3(0.,0.,1.);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`;
 bundle.material.fragmentShader=bundle.material.fragmentShader.replace(
 'vec2 angles = visualAngles(vVisualNormal);',
 'vec2 angles = vec2((vUv.x - 0.5) * TWO_PI, (vUv.y - 0.5) * PI);');
 bundle.material.fragmentShader=bundle.material.fragmentShader.replace(
 'gl_FragColor = vec4(color, 1.0);','gl_FragColor = vec4(albedo, 1.0);');
 bundle.material.uniforms.uSunDirectionBodyLocal.value.set(0,0,0.7);
 bundles.set(id,bundle);
}
const mesh=new THREE.Mesh(geometry);scene.add(mesh);
window.sampleIceClouds=(id,quality=2,days=0)=>{
 const material=bundles.get(id).material;mesh.material=material;
 material.uniforms.uQuality.value=quality;material.uniforms.uAtmosphereTimeDays.value=days;
 renderer.render(scene,camera);
 const pixels=new Uint8Array(width*height*4),gl=renderer.getContext();
 gl.readPixels(0,0,width,height,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
 const rows=[],meanRgb=[0,0,0];let variance=0,seamMax=0,hash=2166136261;
 for(const value of pixels){hash=Math.imul(hash^value,16777619)>>>0;}
 for(let y=40;y<height-40;y++){
  let sum=0,square=0;for(let x=0;x<width;x++){
   const i=(y*width+x)*4,luma=.2126*pixels[i]+.7152*pixels[i+1]+.0722*pixels[i+2];
   sum+=luma;square+=luma*luma;for(let c=0;c<3;c++)meanRgb[c]+=pixels[i+c];
  }
  const mean=sum/width;rows.push(mean);variance+=square/width-mean*mean;
  for(let c=0;c<3;c++)seamMax=Math.max(seamMax,Math.abs(pixels[y*width*4+c]-pixels[(y*width+width-1)*4+c]));
 }
 rows.sort((a,b)=>a-b);const count=rows.length;
 return {zonalSpread:rows[Math.floor(count*.9)]-rows[Math.floor(count*.1)],
 longitudinalRms:Math.sqrt(Math.max(0,variance/count)),seamMax,hash,
 meanRgb:meanRgb.map(v=>v/(count*width)),glError:gl.getError()};
};window.ready=true;
</script></body></html>
