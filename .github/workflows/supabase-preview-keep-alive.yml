# Send a small database request to the free-tier Supabase preview project.
# Project: iom-website-preview (ijjnstbwvuwwznfagxut).
# Required repo secret:
#   SUPABASE_PREVIEW_ANON_KEY  Preview anon / publishable key
# Optional:
#   SUPABASE_PREVIEW_URL       defaults to https://ijjnstbwvuwwznfagxut.supabase.co

name: Supabase preview keep-alive

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: supabase-preview-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Preview Supabase database
        env:
          SUPABASE_PREVIEW_URL: ${{ secrets.SUPABASE_PREVIEW_URL }}
          SUPABASE_PREVIEW_ANON_KEY: ${{ secrets.SUPABASE_PREVIEW_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_PREVIEW_ANON_KEY:-}" ]; then
            echo "::error::Missing GitHub secret SUPABASE_PREVIEW_ANON_KEY."
            echo "Set it in repo Settings → Secrets and variables → Actions (Preview anon key only)."
            exit 1
          fi
          base="${SUPABASE_PREVIEW_URL:-https://ijjnstbwvuwwznfagxut.supabase.co}"
          base="${base%/}"
          restore_url="https://supabase.com/dashboard/project/ijjnstbwvuwwznfagxut"
          # Execute a database query without retrieving staff records.
          path="/rest/v1/crm_staff_profiles?select=id&limit=0"

          body_file=$(mktemp)
          trap 'rm -f "$body_file"' EXIT

          attempt=1
          max_attempts=8
          # Worst case: 8 * 20s requests + 7 * 15s waits = 265s, below 5 minutes.
          while [ "$attempt" -le "$max_attempts" ]; do
            # curl may fail before creating an output file. Also discard stale responses.
            : > "$body_file"
            curl_exit=0
            http=$(curl -sS -o "$body_file" -w "%{http_code}" \
              --connect-timeout 10 --max-time 20 \
              "${base}${path}" \
              -H "apikey: ${SUPABASE_PREVIEW_ANON_KEY}" \
              -H "Accept: application/json") || curl_exit=$?
            bytes=$(wc -c < "$body_file" | tr -d '[:space:]')
            echo "attempt=${attempt}/${max_attempts} HTTP ${http:-000} curl_exit=${curl_exit} bytes=${bytes}"

            if [ "$curl_exit" -ne 0 ]; then
              echo "Network error reaching Preview Supabase; retrying within the attempt budget."
            else
              # Log only a bounded error code, never response data or credentials.
              api_code=$(jq -er '.code | select(type == "string") | select(test("^[A-Za-z0-9_]{1,40}$"))' "$body_file" 2>/dev/null || true)
              case "$http" in
                200|206)
                  if jq -e 'type == "array"' "$body_file" >/dev/null 2>&1; then
                    echo "Keep-alive OK: database query completed."
                    exit 0
                  fi
                  echo "::error::Unexpected successful response: expected a PostgREST JSON array."
                  exit 1
                  ;;
                401|403)
                  # PostgREST forwards PostgreSQL insufficient_privilege as SQLSTATE 42501.
                  # This proves the database was reached without granting access to staff data.
                  # Gateway/JWT errors (including PGRST301/302/303) do not prove database activity.
                  if [ "$api_code" = "42501" ]; then
                    echo "Keep-alive OK: database reached; read blocked by existing permissions (SQLSTATE 42501)."
                    exit 0
                  fi
                  echo "::error::Preview API authentication failed (HTTP $http, code=${api_code:-unknown}). Check SUPABASE_PREVIEW_ANON_KEY and SUPABASE_PREVIEW_URL."
                  exit 1
                  ;;
                540)
                  echo "::error::Preview project is paused (HTTP 540). Resume it: $restore_url"
                  exit 1
                  ;;
                546)
                  echo "::error::Supabase reported an Edge Functions resource limit (HTTP 546), not a paused database. Check the Preview URL."
                  exit 1
                  ;;
                408|429|5??)
                  echo "Temporary Preview service error (HTTP $http, code=${api_code:-unknown}); retrying."
                  ;;
                *)
                  echo "::error::Unexpected Preview response (HTTP ${http:-000}, code=${api_code:-unknown})."
                  exit 1
                  ;;
              esac
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::Keep-alive failed after $max_attempts attempts."
              exit 1
            fi
            sleep 15
            attempt=$((attempt + 1))
          done
