# Keep free-tier Supabase preview project from auto-pausing after ~7 days idle.
# Project: iom-website-preview (ijjnstbwvuwwznfagxut) — Preview only, not production.
#
# Supabase counts *database* requests (PostgREST), not Auth health / OpenAPI root.
# Required repo secret:
#   SUPABASE_PREVIEW_ANON_KEY  Preview anon / publishable key
# Optional:
#   SUPABASE_PREVIEW_URL       defaults to https://ijjnstbwvuwwznfagxut.supabase.co

name: Supabase preview keep-alive

on:
  schedule:
    # Daily at 06:17 UTC — a few DB requests per week is the documented bar.
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: supabase-preview-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Preview Supabase database
        env:
          SUPABASE_PREVIEW_URL: ${{ secrets.SUPABASE_PREVIEW_URL }}
          SUPABASE_PREVIEW_ANON_KEY: ${{ secrets.SUPABASE_PREVIEW_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_PREVIEW_ANON_KEY:-}" ]; then
            echo "Missing GitHub secret SUPABASE_PREVIEW_ANON_KEY."
            echo "Set it in repo Settings → Secrets and variables → Actions (Preview anon key only)."
            exit 1
          fi
          base="${SUPABASE_PREVIEW_URL:-https://ijjnstbwvuwwznfagxut.supabase.co}"
          base="${base%/}"
          restore_url="https://supabase.com/dashboard/project/ijjnstbwvuwwznfagxut"
          path="/rest/v1/crm_staff_profiles?select=id&limit=1"

          # After Resume, origin can return 521/502 for a few minutes.
          attempt=1
          max_attempts=8
          while [ "$attempt" -le "$max_attempts" ]; do
            set +e
            http=$(curl -sS -o /tmp/supabase-keepalive-body.txt -w "%{http_code}" \
              --connect-timeout 20 --max-time 40 \
              "${base}${path}" \
              -H "apikey: ${SUPABASE_PREVIEW_ANON_KEY}" \
              -H "Accept: application/json")
            curl_exit=$?
            set -e
            bytes=$(wc -c < /tmp/supabase-keepalive-body.txt | tr -d ' ')
            echo "attempt=${attempt}/${max_attempts} HTTP ${http:-000} curl_exit=${curl_exit} bytes=${bytes}"

            if [ "$curl_exit" -ne 0 ]; then
              echo "Network error reaching Preview Supabase."
            elif [ "$http" = "546" ]; then
              echo "Preview project is paused (HTTP 546). Resume it: ${restore_url}"
              exit 1
            elif [ "$http" = "520" ] || [ "$http" = "521" ] || [ "$http" = "502" ] || [ "$http" = "503" ]; then
              echo "Project still warming (HTTP ${http})."
            else
              case "$http" in
                200|206|401|403)
                  # Reached PostgREST / Postgres (401/403 from RLS or missing GRANT still count).
                  echo "Keep-alive ping OK (database activity registered)."
                  exit 0
                  ;;
                *)
                  echo "Unexpected HTTP ${http}."
                  ;;
              esac
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Keep-alive failed after ${max_attempts} attempts."
              echo "If paused, resume: ${restore_url}"
              exit 1
            fi
            sleep 15
            attempt=$((attempt + 1))
          done
