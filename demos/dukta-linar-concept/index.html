<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>LINAR — dukta flexible wood concept</title>
    <meta
      name="description"
      content="Interactive concept: a LINAR wood panel begins flat and bends into a curved architectural surface. Conceptual visualisation only."

    <meta name="robots" content="noindex, follow" />

  <body class="linar-route">
    <script defer src="/demos/iom-back.js"></script>
    <div id="root">
      <div class="linar-boot" role="status">

        <p class="linar-boot__hint">Opening LINAR…</p>
